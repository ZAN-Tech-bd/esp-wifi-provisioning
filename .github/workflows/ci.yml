name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-build:
    name: Compile firmware (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - name: ArduinoJson
              version: 7.2.0
          sketch-paths: |
            - firmware/esp-ble-wifi-provisioning

  app-analyze:
    name: Analyze Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Scaffold platform folders
        working-directory: app
        run: flutter create --org com.zantech --project-name zan_wifi_provisioning .
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
