sentence=One-time Wi-Fi setup for any ESP32 project - hotspot + web form, no app, no re-uploading.
paragraph=Include this once and every new ESP32 project gets Wi-Fi provisioning for free: tries the last saved network on boot, opens a setup hotspot with a web form if that fails (or none was ever saved), shows connection status on the onboard LED, and resets from a single button hold. Write your own project logic in your own sketch and never touch the Wi-Fi part again.
